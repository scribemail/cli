name: Release

# Fires only on semver version tags, e.g. v1.0.0 / v1.2.3.
# Cut a release with `pnpm release` (prompts for the bump, then bumps + tags + pushes).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm Trusted Publishing (OIDC) — short-lived, no long-lived token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli

      # See ci.yml — the private sibling checkout needs its own read token.
      - uses: actions/checkout@v4
        with:
          repository: scribemail/mcp-server
          path: mcp-server
          token: ${{ secrets.MCP_SERVER_CHECKOUT_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            cli/pnpm-lock.yaml
            mcp-server/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install (mcp-server)
        working-directory: mcp-server
        run: pnpm install --frozen-lockfile

      - name: Install (cli)
        working-directory: cli
        run: pnpm install --frozen-lockfile

      # The tag must match package.json exactly, so a mistagged release fails
      # here before anything is published.
      - name: Verify tag matches package.json version
        working-directory: cli
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION. Bump package.json and retag."
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Typecheck
        working-directory: cli
        run: pnpm typecheck

      - name: Test
        working-directory: cli
        run: pnpm test

      - name: Build
        working-directory: cli
        run: pnpm build

      - name: E2E (bundled bin)
        working-directory: cli
        run: pnpm test:e2e

      # npm — Trusted Publishing via OIDC. No NPM_TOKEN: the runner exchanges a
      # short-lived id-token for publish rights, and provenance is attached
      # automatically. Requires npm >= 11.5.1 (newer than the runner default).
      # One-time prerequisite: the package must already exist on npm and have a
      # Trusted Publisher configured for org "scribemail", repo "cli",
      # workflow "release.yml".
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest
      - name: Publish to npm
        working-directory: cli
        # Idempotent: skip if this exact version is already on npm (e.g. the
        # one-time bootstrap publish, or a re-run).
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION already published — skipping npm publish."
          else
            npm publish
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
