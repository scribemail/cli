name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, stated here so it holds even if the repo default changes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The CLI imports the tool core from ../mcp-server at build time, so the
      # two repos are laid out as siblings — exactly like a local checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: cli

      # GITHUB_TOKEN is scoped to this repo only; reading the private sibling
      # needs a fine-grained PAT (contents: read on scribemail/mcp-server)
      # stored as the MCP_SERVER_CHECKOUT_TOKEN secret.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: scribemail/mcp-server
          path: mcp-server
          token: ${{ secrets.MCP_SERVER_CHECKOUT_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cli/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            cli/pnpm-lock.yaml
            mcp-server/pnpm-lock.yaml

      - name: Install (mcp-server — the imported core resolves its own deps)
        working-directory: mcp-server
        run: pnpm install --frozen-lockfile

      - name: Install (cli)
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: cli
        run: pnpm lint

      - name: Typecheck
        working-directory: cli
        run: pnpm typecheck

      - name: Test
        working-directory: cli
        run: pnpm test

      - name: Build
        working-directory: cli
        run: pnpm build

      - name: E2E (bundled bin)
        working-directory: cli
        run: pnpm test:e2e
